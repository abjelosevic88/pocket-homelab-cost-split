services:
  pocket-split:
    image: ghcr.io/abjelosevic88/pocket-homelab-cost-split:latest
    container_name: pocket-split
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TZ: ${TZ:-UTC}
      BASE_URL: ${BASE_URL:-}
      DEFAULT_CURRENCY: ${DEFAULT_CURRENCY:-EUR}
      # Set both to skip the first-run setup screen and create the admin directly:
      # ADMIN_EMAIL: ${ADMIN_EMAIL}
      # ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      # SECURE_COOKIES: "true"          # behind HTTPS
      # AUTH_MODE: proxy                # trust Remote-User from Authelia / Authentik / Tinyauth
      # FX_PROVIDER: none               # no internet: type exchange rates by hand
      # DEMO_DATA: "true"               # seed a sample trip and flat share into an empty database
    volumes:
      - ./data:/data
